<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho — Mestre do Pano</title>
  <meta name="description" content="Reveja os produtos no seu carrinho Mestre do Pano.">
  <link rel="icon" href="images/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" href="images/favicon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/checkout.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Mestre <span>do</span> Pano</a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="shop.html">Loja</a>
        <a href="index.html#sobre">Sobre</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="cart-link" aria-current="page">
          Carrinho <span class="cart-count" data-cart-count style="display:none">0</span>
        </a>
        <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>O seu carrinho</h1>
      </div>
    </div>

    <div class="container cart-layout">
      <div class="cart-items" data-cart-list>
        <p class="cart-empty">A carregar…</p>
      </div>

      <aside class="summary-box">
        <h3>Resumo</h3>
        <div class="summary-line">
          <span>Subtotal</span>
          <span data-cart-subtotal>0,00 €</span>
        </div>
        <div class="summary-line">
          <span>Portes</span>
          <span>A calcular no checkout</span>
        </div>
        <div class="summary-line total">
          <span>Total</span>
          <span data-cart-total>0,00 €</span>
        </div>
        <a href="checkout.html" class="btn btn-primary">Finalizar compra</a>
        <p class="summary-note">Pagamento e portes serão implementados numa fase posterior.</p>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; <span data-current-year></span> Mestre do Pano</span>
        <span>Portugal</span>
      </div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
